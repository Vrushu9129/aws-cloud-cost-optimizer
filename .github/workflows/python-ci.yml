
name: Python CI - AWS Cost Optimizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          python -m py_compile ec2_optimizer.py
          python -m py_compile ebs_optimizer.py
          python -m py_compile s3_optimizer.py
          python -m py_compile cost_optimizer.py
